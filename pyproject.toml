version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "prakhar-cymorph", email = "prakhar@cymorph.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "inngest>=0.5.19",
    "llama-index-core>=0.14.25",
    "llama-index-readers-file>=0.7.0",
    "openai>=3.26.0",
    "python-dotenv>=1.2.4",
